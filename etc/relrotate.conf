# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# relrotate global settings (/etc/relrotate/relrotate.conf), sourced as shell.

# Where notifications go. Leave MAIL_TO empty and NOTIFY=() for journal only.
MAIL_TO=""
MAIL_FROM=""

# Chat and push destinations, besides or instead of mail: kind:file. The
# file holds the secret, so keep it root-only (chmod 0600), like the tokens:
#   discord   the webhook URL (Server settings > Integrations > Webhooks)
#   telegram  line 1 the bot token, line 2 the chat id
#   ntfy      the topic URL, e.g. https://ntfy.sh/<long-random-topic>
#   webhook   a URL that gets a JSON POST:
#             {"source":"relrotate","host":..,"app":..,"title":..,"body":..}
#             (for a bot of your own; http:// is allowed for a local one)
# NOTIFY=(discord:/etc/relrotate/discord.url telegram:/etc/relrotate/telegram)
NOTIFY=()

# When messages go out (mail and NOTIFY alike):
#   each      every event at once (default)
#   failures  failures and blocks at once; updates and recoveries wait for
#             the summary
#   digest    everything waits for the summary
# The summary is sent by relrotate-digest.timer (daily 08:00) and at the end
# of update-all; enable the timer when this is not "each".
NOTIFY_POLICY=each

# Default for every recipe: install a release only when it is this many
# days old (0 = at once). A recipe can set its own MIN_AGE_DAYS.
MIN_AGE_DAYS=0

# Optional API tokens (file containing only the token, mode 0600).
# GitHub allows 60 unauthenticated API calls per hour per IP; a token
# raises that a lot. A fine-grained token with no permissions is enough
# for public repos.
GITHUB_TOKEN_FILE=""
GITEA_TOKEN_FILE=""
# The one Gitea token goes to every Gitea host a recipe names, over https
# only. To limit it, list the host names here (space-separated); then it is
# sent to those hosts only.
GITEA_TOKEN_HOSTS=""

# Extra curl options for every request, e.g. a proxy:
# CURL_OPTS=(--proxy http://proxy.example.net:3128)
CURL_OPTS=()
