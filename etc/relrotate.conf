# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# relrotate global settings (/etc/relrotate/relrotate.conf), sourced as shell.

# Where notifications go. Leave MAIL_TO empty to only log to the journal.
MAIL_TO=""
MAIL_FROM=""

# Optional API tokens (file containing only the token, mode 0600).
# GitHub allows 60 unauthenticated API calls per hour per IP; a token
# raises that a lot. A fine-grained token with no permissions is enough
# for public repos.
GITHUB_TOKEN_FILE=""
GITEA_TOKEN_FILE=""

# Extra curl options for every request, e.g. a proxy:
# CURL_OPTS=(--proxy http://proxy.example.net:3128)
CURL_OPTS=()
