# Lint on every pull request and push to main; the tests once per release.
# Lint runs in the shared job image (git.raatti.net/infra/ci, repository
# infra/forgejo-runners), which holds shellcheck and every tool the tests
# need; neither job installs anything. The checks live in tests/check.sh.
# actions/checkout v7.0.1 is the same commit on code.forgejo.org and
# github.com, whichever the instance's DEFAULT_ACTIONS_URL points at.
name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: git.raatti.net/infra/ci:almalinux-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: tests/check.sh lint

  # Minutes on the runner: a release tag or the "run workflow" button only.
  tests:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: git.raatti.net/infra/ci:almalinux-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and test
        run: tests/check.sh
