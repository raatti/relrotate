# Lint and test on every pull request and on pushes to main.
# Same job as .forgejo/workflows/checks.yml; the checks live in tests/check.sh.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            shellcheck jq curl bzip2 xz-utils unzip zip

      - name: Lint and test
        run: tests/check.sh
