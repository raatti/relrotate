# Lint and test on every pull request and on pushes to main.
# Same job as .forgejo/workflows/checks.yml; the checks live in tests/check.sh.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            shellcheck jq curl bzip2 xz-utils unzip

      - name: Lint and test
        run: tests/check.sh
