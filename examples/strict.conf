# Optional stricter sandbox for one app:
#   systemctl edit relrotate@element-web.service
# and paste the lines below, then keep only the paths that app's recipe writes
# to. UNTESTED on a real host: start from this, run `systemctl start
# relrotate@<app>.service` and read the journal. Exit 226/NAMESPACE means a
# path below is missing; exit 1 with "Read-only file system" means a path your
# recipe writes to is not listed. Not in the list below, and not confirmed
# either way: /run/libpod (podman runtime state) and your BACKUP_DIR; add them
# to ReadWritePaths= when the app needs them.

[Service]
# Everything outside /dev, /proc, /sys is read-only unless listed below.
ProtectSystem=strict

# /home, /root and /run/user become empty. This BREAKS: rootless podman
# (QUADLET_USER: its quadlets and storage live under the user's home), and
# token files (GITHUB_TOKEN_FILE, GITEA_TOKEN_FILE) or GPG keyrings kept under
# /root. Keep those under /etc/relrotate instead, or drop this line.
ProtectHome=yes

# The leading "-" makes a path optional: without it a missing directory fails
# the whole unit before it starts. /var/lib/relrotate is not listed: the
# shipped unit's StateDirectory= already makes it writable.
# Install targets, one line each; delete the ones this app does not use:
#   /var/www                     symlink layout in the web root (and its releases dir)
#   /usr/local/bin               binary layout
#   /etc/containers/systemd      container layout, rootful quadlets
#   /var/lib/containers          podman image storage, for the image pull
#   /run/containers              podman runtime state, for the image pull
ReadWritePaths=-/var/www
ReadWritePaths=-/usr/local/bin
ReadWritePaths=-/etc/containers/systemd
ReadWritePaths=-/var/lib/containers -/run/containers

# Postfix spool: keep these two if mail notifications are on. Without them
# postdrop cannot queue the mail under ProtectSystem=strict and the run hangs.
ReadWritePaths=-/var/spool/postfix/maildrop -/var/spool/postfix/public
