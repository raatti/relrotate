# Optional stricter sandbox for one app:
#   systemctl edit relrotate@element-web.service
# and paste the lines below, listing the paths that app's recipe writes to.
#
# Keep the two Postfix spool paths if mail notifications are on: without them
# postdrop cannot queue the mail under ProtectSystem=strict and the run hangs.

[Service]
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/relrotate /var/www
ReadWritePaths=/var/spool/postfix/maildrop /var/spool/postfix/public
