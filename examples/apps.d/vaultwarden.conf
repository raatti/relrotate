# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Vaultwarden: podman quadlet. Tags have no "v" (1.37.5), and the image tag
# is the same plain version, so IMAGE uses ${VERSION}.

SOURCE=github:dani-garcia/vaultwarden
TAG_PREFIX=""
POLICY="minor"

LAYOUT=container
QUADLET=/etc/containers/systemd/vaultwarden.container
IMAGE='docker.io/vaultwarden/server:${VERSION}'
SERVICE=vaultwarden.service

# Password vault: SQLite backup before every update.
pre_update() {
    local db=/var/lib/vaultwarden/db.sqlite3 dir=/var/lib/vaultwarden/backups
    [[ -f "$db" ]] || return 0
    mkdir -p "$dir"
    sqlite3 "$db" ".backup '$dir/db-$OLD_VERSION-$(date +%Y%m%d%H%M%S).sqlite3'"
}

HEALTH_URL=http://127.0.0.1:8080/alive
HEALTH_RETRIES=10
