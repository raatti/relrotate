# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Uptime Kuma: podman quadlet. Tags and image tags are plain (2.5.11).
# Monitor the monitor: relrotate's health check is the only thing that
# notices if Uptime Kuma itself does not come back.

SOURCE=github:louislam/uptime-kuma
TAG_PREFIX=""
POLICY="minor"

LAYOUT=container
QUADLET=/etc/containers/systemd/uptime-kuma.container
IMAGE='docker.io/louislam/uptime-kuma:${VERSION}'
SERVICE=uptime-kuma.service

HEALTH_URL=http://127.0.0.1:3001/
HEALTH_RETRIES=20
HEALTH_DELAY=5
