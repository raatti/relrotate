# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Forgejo Runner: single binary from code.forgejo.org (Forgejo release API).
# code.forgejo.org sits behind Anubis; it answers relrotate's plain
# User-Agent but challenges browser-like ones.

SOURCE=gitea:https://code.forgejo.org/forgejo/runner
ASSET='forgejo-runner-${VERSION}-linux-${ARCH}'
VERIFY="sha256-sidecar"               # forgejo-runner-X.Y.Z-linux-amd64.sha256
# Signed too (.asc next to each binary); add once the key is in a keyring:
# VERIFY="sha256-sidecar gpg"
# GPG_KEYRING=/etc/relrotate/keys/forgejo.gpg

POLICY="minor"                        # runner majors (12 -> 13) mail only

LAYOUT=binary
TARGET=/usr/local/bin/forgejo-runner
SERVICE=forgejo-runner.service

current_version() {
    "$TARGET" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
