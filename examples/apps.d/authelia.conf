# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Authelia: podman quadlet. Tags v4.39.28, image tag 4.39.28.
# It guards every login behind it, so: patches automatically, new 4.x
# series by hand after reading the migration notes.

SOURCE=github:authelia/authelia
POLICY="patch"

LAYOUT=container
QUADLET=/etc/containers/systemd/authelia.container
IMAGE='docker.io/authelia/authelia:${VERSION}'
SERVICE=authelia.service

HEALTH_URL=http://127.0.0.1:9091/api/health
HEALTH_RETRIES=10
