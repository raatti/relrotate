# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Element Web: static files, symlink-release layout.
#   /var/www/element -> /var/www/element-releases/<version>/

SOURCE=github:element-hq/element-web
ASSET='element-${TAG}.tar.gz'         # element-v1.12.35.tar.gz
VERIFY="api-digest gpg"
GPG_SIG_ASSET='element-${TAG}.tar.gz.asc'
# Import the Element release key once:
#   gpg --no-default-keyring --keyring /etc/relrotate/keys/element.gpg --import <key.asc>
GPG_KEYRING=/etc/relrotate/keys/element.gpg

POLICY="minor"

LAYOUT=symlink
TARGET=/var/www/element
RELEASES_DIR=/var/www/element-releases
STRIP_COMPONENTS=1                    # tarball has an element-vX.Y.Z/ top dir
OWNER=root:root
KEEP=3

# Site config lives outside the release tree and is copied into each one.
COPY=('config.chat.example.net.json:/etc/element-web/config.chat.example.net.json')

# Static files: no service to restart, but check the web server serves it.
HEALTH_URL=https://chat.example.net/version
