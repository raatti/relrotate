# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# NPMplus: podman quadlet. Upstream tags its releases and images by date
# (2026-11-18-r1); VERSION_REGEX reads that as version 2026.11.18.1.
# The quadlet must name a dated tag, not :latest, and must not set
# AutoUpdate=registry: two updaters would fight over the image.

SOURCE=github:ZoeyVid/NPMplus
VERSION_REGEX='^(?<v1>[0-9]{4})-(?<v2>[0-9]{2})-(?<v3>[0-9]{2})-r(?<v4>[0-9]+)$'
POLICY="major"                        # a date has no major or minor: take every release

LAYOUT=container
QUADLET=/etc/containers/systemd/npmplus.container
QUADLET_USER=""                       # the owner's name for a rootless quadlet
IMAGE='docker.io/zoeyvid/npmplus:${TAG}'
SERVICE=npmplus.service
