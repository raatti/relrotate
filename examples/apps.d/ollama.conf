# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Ollama: the tarball holds bin/ollama plus lib/ollama/ (CUDA and CPU
# runners), a release tree rather than one binary. ollama looks for its
# libraries next to its real path (../lib/ollama), so a symlink in PATH works:
#   /opt/ollama -> /opt/ollama-releases/<version>/{bin,lib}
#   /usr/local/bin/ollama -> /opt/ollama/bin/ollama
# The unit runs /opt/ollama/bin/ollama serve. Models stay in the ollama user's
# ~/.ollama and are not touched.
#
# Moving an install.sh install (/usr/local/bin/ollama + /usr/local/lib/ollama)
# over, once, before `relrotate adopt ollama`:
#   v=$(ollama --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)
#   install -d /opt/ollama-releases/$v/bin /opt/ollama-releases/$v/lib
#   mv /usr/local/lib/ollama /opt/ollama-releases/$v/lib/ollama
#   mv /usr/local/bin/ollama /opt/ollama-releases/$v/bin/ollama
#   ln -sfn /opt/ollama-releases/$v /opt/ollama
#   ln -sfn /opt/ollama/bin/ollama /usr/local/bin/ollama
#   restorecon -R /opt/ollama-releases /opt/ollama /usr/local/bin/ollama
#   systemctl edit ollama.service   # ExecStart= then ExecStart=/opt/ollama/bin/ollama serve
# The default SELinux policy labels /opt/*/bin bin_t and /opt/*/lib lib_t.

SOURCE=github:ollama/ollama
ASSET='ollama-linux-${ARCH}.tar.zst'      # ~1.6 GB; -rocm and -mlx variants exist
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET=sha256sum.txt              # lines are "<hash>  ./<name>"
POLICY="major"                            # still 0.x, where minor means patch only

LAYOUT=symlink
TARGET=/opt/ollama
RELEASES_DIR=/opt/ollama-releases
STRIP_COMPONENTS=0                        # bin/ and lib/ at the top
OWNER=root:root
KEEP=2                                    # each release is ~5 GB unpacked

SERVICE=ollama.service
HEALTH_RETRIES=10
HEALTH_DELAY=3
# The new server answers, and it is the new version.
healthcheck() {
    curl -fsS --max-time 10 http://127.0.0.1:11434/api/version | grep -q "\"$VERSION\""
}
