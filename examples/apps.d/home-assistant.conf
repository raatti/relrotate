# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Home Assistant: podman quadlet, date-based versions (2026.11.1).
# Read as YEAR.MONTH.PATCH, the policies mean:
#   patch = fixes within this month's release   (2026.11.0 -> 2026.11.1)
#   minor = any release this year               (2026.11 -> 2026.12)
#   major = anything, across new year
# Monthly releases carry the breaking changes, so "patch" plus a mail for
# each monthly release is the calm default. Betas (2026.11.0b6) are skipped.

SOURCE=github:home-assistant/core
TAG_PREFIX=""
POLICY="patch"

LAYOUT=container
QUADLET=/etc/containers/systemd/home-assistant.container
IMAGE='ghcr.io/home-assistant/home-assistant:${VERSION}'
SERVICE=home-assistant.service

HEALTH_URL=http://127.0.0.1:8123/
HEALTH_RETRIES=30                     # first start after an update is slow
HEALTH_DELAY=5
