# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# FreshRSS: PHP app, symlink-release layout, data kept outside the tree.
# Upstream attaches no release assets, so the GitHub source tarball is used.
# GitHub source tarballs have no published checksum; HTTPS from GitHub is
# the trust anchor here, and relrotate logs a warning about it every run.

SOURCE=github:FreshRSS/FreshRSS
TAG_PREFIX=""                         # tags are plain 1.30.4
ASSET='@tarball'
VERIFY=none

POLICY="minor"

LAYOUT=symlink
TARGET=/var/www/freshrss
RELEASES_DIR=/var/www/freshrss-releases
STRIP_COMPONENTS=1                    # FreshRSS-FreshRSS-<sha>/ top dir
OWNER=apache:apache                   # www-data:www-data on Debian/Ubuntu

# data/ and extensions/ live in /var/lib/freshrss and are linked in.
LINKS=(
    'data:/var/lib/freshrss/data'
    'extensions:/var/lib/freshrss/extensions'
)

HEALTH_URL=http://127.0.0.1/i/
