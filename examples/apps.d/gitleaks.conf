# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# gitleaks: tar.gz with the binary at the top (gitleaks, LICENSE, README.md).
# Its asset names say x64/arm64, not relrotate's amd64, so the arch is
# mapped here. Nothing runs as a service.
case "$(uname -m)" in
    x86_64)  GITLEAKS_ARCH=x64 ;;
    aarch64) GITLEAKS_ARCH=arm64 ;;
    armv7l)  GITLEAKS_ARCH=armv7 ;;
    *)       GITLEAKS_ARCH="$(uname -m)" ;;
esac
SOURCE=github:gitleaks/gitleaks
ASSET='gitleaks_${VERSION}_linux_'"$GITLEAKS_ARCH"'.tar.gz'
ARCHIVE_MEMBER=gitleaks
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET='gitleaks_${VERSION}_checksums.txt'
POLICY="minor"
LAYOUT=binary
TARGET=/usr/local/bin/gitleaks
current_version() {
    "$TARGET" version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
healthcheck() { "$TARGET" version >/dev/null; }
