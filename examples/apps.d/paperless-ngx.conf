# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Paperless-ngx: podman quadlet. GitHub tags are v3.4.2, the image tag is
# 3.4.2, so IMAGE uses ${VERSION} (the tag without the v).

SOURCE=github:paperless-ngx/paperless-ngx
POLICY="minor"

LAYOUT=container
QUADLET=/etc/containers/systemd/paperless.container
IMAGE='ghcr.io/paperless-ngx/paperless-ngx:${VERSION}'
SERVICE=paperless.service

# Migrations run on start: export first. If a backup unit already exists,
# just start it, e.g.:
# pre_update() { systemctl start paperless-backup.service; }

HEALTH_URL=http://127.0.0.1:8000/
HEALTH_RETRIES=20
HEALTH_DELAY=5
