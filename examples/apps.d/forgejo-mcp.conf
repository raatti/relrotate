# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# forgejo-mcp (MCP server for a Forgejo instance): rootful quadlet. Releases
# and images are both on git.b4mad.industries, a Forgejo with its own
# container registry; the image tags keep the v (v3.6.0).

SOURCE=gitea:https://git.b4mad.industries/agentic-forges/forgejo-mcp
POLICY="minor"
# The image can land some time after the release. Until it does, the pull
# fails before anything changes (one alert) and the next run tries again.

LAYOUT=container
QUADLET=/etc/containers/systemd/forgejo-mcp.container
QUADLET_USER=""
IMAGE='git.b4mad.industries/agentic-forges/forgejo-mcp:${TAG}'
SERVICE=forgejo-mcp.service
# A minimal image with no shell and, here, no published port: the unit staying
# active after the restart is the check.
