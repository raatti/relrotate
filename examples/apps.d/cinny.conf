# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Cinny: Matrix web client, static files, symlink-release layout.
#   /var/www/cinny -> /var/www/cinny-releases/<version>/

SOURCE=github:cinnyapp/cinny
ASSET='cinny-${TAG}.tar.gz'           # cinny-v4.12.8.tar.gz
VERIFY="api-digest gpg"
GPG_SIG_ASSET='cinny-${TAG}.tar.gz.asc'
# Import the Cinny release key once:
#   gpg --no-default-keyring --keyring /etc/relrotate/keys/cinny.gpg --import <key.asc>
GPG_KEYRING=/etc/relrotate/keys/cinny.gpg

POLICY="minor"

LAYOUT=symlink
ON_SECURITY_FAILURE=maintenance       # failed security release: maintenance page, not the old version
TARGET=/var/www/cinny
RELEASES_DIR=/var/www/cinny-releases
# Check the tarball's top directory once before the first run:
#   tar -tzf cinny-v4.12.8.tar.gz | head
# and set STRIP_COMPONENTS so index.html lands at the release root.
STRIP_COMPONENTS=1
OWNER=root:root

COPY=('config.json:/etc/cinny/config.json')

HEALTH_URL=https://cinny.example.net/
