# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Hugo (extended): command-line tool, no service. The tarball holds hugo,
# LICENSE and README.md, so ARCHIVE_MEMBER picks the binary.

SOURCE=github:gohugoio/hugo
ASSET='hugo_extended_${VERSION}_linux-${ARCH}.tar.gz'
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET='hugo_${VERSION}_checksums.txt'
ARCHIVE_MEMBER=hugo

# Hugo is 0.x and ships a new minor almost every month (0.168 -> 0.169).
# Under semver rules POLICY=minor would only take 0.169.x patches, which
# Hugo rarely makes, so this is the one place "major" is the sensible
# default. Pin it to "minor" if a site build is mission critical.
POLICY="major"

LAYOUT=binary
TARGET=/usr/local/bin/hugo

current_version() {
    "$TARGET" version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
healthcheck() { "$TARGET" version >/dev/null; }
