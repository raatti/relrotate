# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# rclone: zip with a top directory, e.g. rclone-v1.76.0-linux-amd64/rclone.
# Needs unzip on the host.

SOURCE=github:rclone/rclone
ASSET='rclone-${TAG}-linux-${ARCH}.zip'
ARCHIVE_MEMBER='rclone-${TAG}-linux-${ARCH}/rclone'
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET=SHA256SUMS            # PGP-clearsigned; the hash lines parse as usual

POLICY="minor"

LAYOUT=binary
TARGET=/usr/local/bin/rclone

current_version() {
    "$TARGET" version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
healthcheck() { "$TARGET" version >/dev/null; }
