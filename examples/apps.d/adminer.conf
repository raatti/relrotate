# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Adminer: a single PHP file. Each release gets its own directory with the
# file renamed to index.php, so the web server config never changes.
#   /var/www/adminer -> /var/www/adminer-releases/<version>/index.php
#
# Adminer is a database login page: keep it behind a VPN, an IP allowlist
# or an auth proxy, never open to the internet.

SOURCE=github:vrana/adminer
ASSET='adminer-${VERSION}.php'        # also -en.php, -mysql.php, -mysql-en.php
VERIFY=api-digest

POLICY="minor"

LAYOUT=symlink
TARGET=/var/www/adminer
RELEASES_DIR=/var/www/adminer-releases
EXTRACT=none                          # copy the file as is
OWNER=root:root

post_extract() {
    mv "$RELEASE_DIR/adminer-$VERSION.php" "$RELEASE_DIR/index.php"
}

HEALTH_URL=https://db.example.net/
