# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# tuwunel: rootless podman quadlet with a pinned image tag.
# relrotate reads versions from GitHub releases, pulls the matching image
# as the quadlet's owner, rewrites Image=, reloads and restarts.

SOURCE=github:matrix-construct/tuwunel
POLICY="minor"

LAYOUT=container
QUADLET=/home/tuwunel/.config/containers/systemd/tuwunel.container
QUADLET_USER=tuwunel                  # empty for rootful quadlets in /etc/containers/systemd
IMAGE='ghcr.io/matrix-construct/tuwunel:${TAG}'
SERVICE=tuwunel.service

HEALTH_URL=http://127.0.0.1:8008/_matrix/client/versions
HEALTH_RETRIES=10
HEALTH_DELAY=3
