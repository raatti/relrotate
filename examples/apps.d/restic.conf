# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# restic: one bzip2-compressed binary per platform.
# Upstream signs SHA256SUMS (SHA256SUMS.asc), not each binary; relrotate
# checks the binary against SHA256SUMS and against the API digest.

SOURCE=github:restic/restic
ASSET='restic_${VERSION}_linux_${ARCH}.bz2'
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET=SHA256SUMS

# restic is 0.x: POLICY=minor means 0.19.x patches only. Repository format
# changes are announced in the release notes, so minors (0.19 -> 0.20) are
# a "read first" upgrade and arrive as a mail.
POLICY="minor"

LAYOUT=binary
TARGET=/usr/local/bin/restic

current_version() {
    "$TARGET" version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
healthcheck() { "$TARGET" version >/dev/null; }
