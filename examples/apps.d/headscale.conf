# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Headscale: single Go binary from GitHub releases.
# Upstream ships .deb packages and bare binaries, no RPM.

SOURCE=github:juanfont/headscale
ASSET='headscale_${VERSION}_linux_${ARCH}'
# Belt and braces: the API digest and upstream's own checksums.txt must agree.
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET=checksums.txt

# Control plane of the whole tailnet: patch releases only, minors by hand.
POLICY="patch"

LAYOUT=binary
TARGET=/usr/local/bin/headscale
SERVICE=headscale.service
KEEP=3

# Ask the binary itself which version is running (no adopt needed).
current_version() {
    "$TARGET" version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}

# SQLite backup before the new binary runs its migrations.
BACKUP_DIR=/var/lib/headscale/backups
pre_update() { backup_sqlite /var/lib/headscale/db.sqlite db; }

# rkhunter tracks file properties; tell it the new binary is legitimate.
post_flip() {
    if command -v rkhunter >/dev/null 2>&1; then rkhunter --propupd --quiet || true; fi
}
