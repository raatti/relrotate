# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Forgejo: single binary from Codeberg (Forgejo/Gitea release API).

SOURCE=gitea:https://codeberg.org/forgejo/forgejo
ASSET='forgejo-${VERSION}-linux-${ARCH}'
VERIFY="sha256-sidecar"           # forgejo-X.Y.Z-linux-amd64.sha256
# Add signature checking once the release key is in a keyring:
#   gpg --no-default-keyring --keyring /etc/relrotate/keys/forgejo.gpg \
#       --import forgejo-release-key.asc
# VERIFY="sha256-sidecar gpg"
# GPG_KEYRING=/etc/relrotate/keys/forgejo.gpg

POLICY="minor"                      # majors (v16 -> v17) mail only

LAYOUT=binary
TARGET=/usr/local/bin/forgejo
SERVICE=forgejo.service
HEALTH_URL=http://127.0.0.1:3000/api/healthz

current_version() {
    "$TARGET" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}

# Your existing backup unit is a good pre_update:
# pre_update() { systemctl start forgejo-backup.service; }
