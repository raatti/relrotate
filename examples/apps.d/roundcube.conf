# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Roundcube: PHP app, symlink-release layout, upstream update script run
# against the new tree before the symlink flips.

SOURCE=github:roundcube/roundcubemail
TAG_PREFIX=""
ASSET='roundcubemail-${VERSION}-complete.tar.gz'
VERIFY=api-digest

# Roundcube releases are nearly always security fixes: take patches at once,
# move between 1.x branches by hand.
POLICY="patch"

LAYOUT=symlink
ON_SECURITY_FAILURE=maintenance       # failed security release: maintenance page, not the old version
TARGET=/var/www/roundcubemail
RELEASES_DIR=/var/www/roundcubemail-releases
STRIP_COMPONENTS=1
OWNER=root:apache

COPY=('config/config.inc.php:/etc/roundcubemail/config.inc.php')
LINKS=('logs:/var/log/roundcubemail' 'temp:/var/lib/roundcubemail/temp')

# bin/update.sh migrates the database; it must succeed before the flip.
pre_update() {
    (cd "$RELEASE_DIR" && runuser -u apache -- php bin/update.sh --version="$OLD_VERSION")
}

SERVICE=php-fpm.service               # reload the opcache with the new tree
HEALTH_URL=https://mail.example.net/
