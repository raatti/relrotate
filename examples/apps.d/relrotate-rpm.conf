# shellcheck shell=bash disable=SC2034,SC2016
# relrotate itself, installed from the RPM. `relrotate setup` writes this
# recipe for you, as apps.d/relrotate.conf.
# The RPM of a release is checked against SHA256SUMS, and that file against
# the project's signing key, then installed with dnf before anything else
# changes: a failed install leaves the old version in place. relrotate keeps
# each RPM it installed, so a rollback has the previous one; the version that
# was installed by hand before the first update is not kept.

SOURCE=github:raatti/relrotate
ASSET='relrotate-${VERSION}-1.noarch.rpm'
VERIFY="checksums-file"
CHECKSUM_ASSET=SHA256SUMS
CHECKSUM_SIG_ASSET=SHA256SUMS.asc
GPG_KEYRING=/usr/share/relrotate/relrotate-keyring.gpg
POLICY="minor"                        # 0.x: patch releases only

LAYOUT=binary                         # the "binary" is the RPM file
TARGET=/var/lib/relrotate/relrotate/installed.rpm
MODE=0644

current_version() { rpm -q --qf '%{VERSION}' relrotate; }
pre_update()  { dnf -y -q install "$RELEASE_DIR/installed.rpm"; }
on_rollback() { rpm -U --oldpackage "$TARGET"; }
healthcheck() {
    [[ "$(/usr/sbin/relrotate --version)" == "relrotate $(rpm -q --qf '%{VERSION}' relrotate)" ]]
}
