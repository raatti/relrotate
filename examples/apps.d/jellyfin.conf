# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Jellyfin: podman quadlet. Versions have two parts (v12.4); the image tag
# is 12.4. relrotate reads them as 12.4.0 for policy decisions.
# relrotate drives podman quadlets; a Docker-only host (many NAS boxes) is
# not covered yet.

SOURCE=github:jellyfin/jellyfin
POLICY="minor"

LAYOUT=container
QUADLET=/etc/containers/systemd/jellyfin.container
IMAGE='docker.io/jellyfin/jellyfin:${VERSION}'
SERVICE=jellyfin.service

HEALTH_URL=http://127.0.0.1:8096/health
HEALTH_RETRIES=20
HEALTH_DELAY=5
