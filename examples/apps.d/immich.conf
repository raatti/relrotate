# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# Immich: server and machine-learning containers must run the same tag.
# relrotate pulls both images first (nothing changes if either pull fails),
# rewrites both quadlets, reloads once, restarts both, and rolls both back
# together if the health check fails.
#
# Postgres and Redis/Valkey quadlets are NOT in this set: Immich pins
# specific database images per release; upgrade those by hand when the
# release notes say so.

SOURCE=github:immich-app/immich
CONTAINERS=(
    '/etc/containers/systemd/immich-server.container|ghcr.io/immich-app/immich-server:${TAG}'
    '/etc/containers/systemd/immich-machine-learning.container|ghcr.io/immich-app/immich-machine-learning:${TAG}'
)
SERVICE="immich-machine-learning.service immich-server.service"

# Immich moves fast and minors have carried breaking changes: take patches
# automatically, read the notes for each minor (mailed).
POLICY="patch"

LAYOUT=container

# Database dump before the new server runs its migrations. Adjust the
# container and user names to your quadlets.
# Off by default: uncomment the two lines below to take this backup.
# BACKUP_DIR=/var/lib/immich/backups
# pre_update() { backup_pg immich-postgres postgres immich; }

HEALTH_URL=http://127.0.0.1:2283/api/server/ping
HEALTH_RETRIES=30                     # migrations can take a while
HEALTH_DELAY=10
