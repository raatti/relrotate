# shellcheck shell=bash disable=SC2034,SC2016
# relrotate itself, installed with install.sh (0.4.2 or newer). `relrotate
# setup` writes this recipe for you and puts your PREFIX in place of
# /usr/local.
# install.sh keeps the tree it installed from in RELEASES_DIR/<version> and
# points TARGET at it. An update unpacks the new release next to it and runs
# its install.sh; a rollback runs the old one again. Releases are checked
# against SHA256SUMS, and that file against the project's signing key.

SOURCE=github:raatti/relrotate
ASSET='relrotate-${VERSION}.tar.gz'
VERIFY="checksums-file"
CHECKSUM_ASSET=SHA256SUMS
CHECKSUM_SIG_ASSET=SHA256SUMS.asc
GPG_KEYRING=/usr/local/share/relrotate/relrotate-keyring.gpg
POLICY="minor"                        # 0.x: patch releases only

LAYOUT=symlink
TARGET=/usr/local/lib/relrotate-current
RELEASES_DIR=/usr/local/lib/relrotate-releases

# stdin closed: install.sh must not ask anything in a timer run. Its "Next:"
# text is dropped, its errors go to the journal.
post_flip()   { PREFIX=/usr/local "$TARGET/install.sh" < /dev/null > /dev/null; }
on_rollback() { PREFIX=/usr/local "$TARGET/install.sh" < /dev/null > /dev/null; }
healthcheck() {
    [[ "$(/usr/local/sbin/relrotate --version)" == "relrotate $(basename "$(readlink "$TARGET")")" ]]
}
