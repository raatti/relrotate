# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# fabric (danielmiessler/fabric): tar.gz with the binary at the top. Asset
# names carry no version and use uname-style arch (Linux_x86_64), so the arch
# is mapped here. The binary only: patterns and ~/.config/fabric are the
# user's (`fabric --updatepatterns`). Nothing runs as a service.
case "$(uname -m)" in
    x86_64)  FABRIC_ARCH=x86_64 ;;
    aarch64) FABRIC_ARCH=arm64 ;;
    *)       FABRIC_ARCH="$(uname -m)" ;;
esac
SOURCE=github:danielmiessler/fabric
ASSET='fabric_Linux_'"$FABRIC_ARCH"'.tar.gz'
ARCHIVE_MEMBER=fabric
VERIFY="api-digest checksums-file"
CHECKSUM_ASSET='fabric_${VERSION}_checksums.txt'
POLICY="minor"
LAYOUT=binary
TARGET=/usr/local/bin/fabric
current_version() {
    "$TARGET" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
}
healthcheck() { "$TARGET" --version >/dev/null; }
