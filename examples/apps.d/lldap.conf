# shellcheck shell=bash disable=SC2034,SC2016,SC2153
# LLDAP: podman quadlet. Here the image tag keeps the v (v0.6.3), so IMAGE
# uses ${TAG}. Docker Hub also has date tags (2026-09-22) and "latest";
# pinning the release tag keeps rollbacks meaningful.

SOURCE=github:lldap/lldap
# 0.x: POLICY=minor means 0.6.x patches only, 0.7 arrives as a mail.
POLICY="minor"

LAYOUT=container
QUADLET=/etc/containers/systemd/lldap.container
IMAGE='docker.io/lldap/lldap:${TAG}'
SERVICE=lldap.service

# The user database is the crown jewel: back it up first. With the default
# SQLite store (adjust the path to your volume):
BACKUP_DIR=/var/lib/lldap/backups
pre_update() { backup_sqlite /var/lib/lldap/users.db users; }

HEALTH_URL=http://127.0.0.1:17170/
HEALTH_RETRIES=10
